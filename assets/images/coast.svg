<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" width="1440" height="420" preserveAspectRatio="xMidYMax slice"><title>Mombasa coastline at sunrise with a dhow</title><style>.wv{animation:wave 9s linear infinite}@keyframes wave{to{transform:translateX(-180px)}}.dh{animation:bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{50%{transform:translateY(-6px) rotate(1deg)}}@media(prefers-reduced-motion:reduce){.wv,.dh{animation:none}}</style><defs>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#FDE68A" stop-opacity=".95"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
  <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="6" height="8" rx="1.500" fill="#FCD34D" opacity=".85"/></pattern>
  <g id="bl"><rect x="0" y="250" width="90" height="100"/><rect x="100" y="200" width="70" height="150"/><rect x="180" y="270" width="80" height="80"/><rect x="280" y="170" width="60" height="180"/><rect x="350" y="240" width="90" height="110"/><rect x="460" y="215" width="70" height="135"/><rect x="975" y="255" width="90" height="95"/><rect x="1080" y="195" width="60" height="155"/><rect x="1150" y="240" width="100" height="110"/><rect x="1270" y="180" width="70" height="170"/><rect x="1350" y="250" width="90" height="100"/></g>
  <g id="sky">
   <circle cx="860" cy="120" r="180" fill="url(#glow)"/><circle cx="860" cy="120" r="62" fill="#FDE68A"/>
   <g fill="#C3DDF0"><rect x="30" y="220" width="70" height="130"/><rect x="230" y="190" width="60" height="160"/><rect x="420" y="230" width="60" height="120"/><rect x="520" y="250" width="80" height="100"/><rect x="940" y="230" width="60" height="120"/><rect x="1060" y="215" width="70" height="135"/><rect x="1240" y="225" width="60" height="125"/></g>
   <use href="#bl" fill="#1B6CA8"/><use href="#bl" fill="url(#win)"/>
   <rect y="335" width="1440" height="90" fill="url(#sea)"/>
   <path class="wv" d="M0 352q45-12 90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
   <path class="wv" d="M-60 385q45-12 90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>
   <g class="dh" transform="translate(640 268)"><path d="M0 62h150l-18 22H22z" fill="#92400E"/><path d="M75 62V0" stroke="#78350F" stroke-width="3"/><path d="M78 4l62 52H78z" fill="#F59E0B"/><path d="M72 14L30 56h42z" fill="#FBBF24"/></g>
  </g>
  </defs><use href="#sky"/></svg>